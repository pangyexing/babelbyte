[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babelbyte"
version = "0.1.0"
description = "AI-powered content subscription system for Reddit and Twitter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BabelByte Team"}
]
keywords = ["ai", "subscription", "reddit", "twitter", "digest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "feedparser>=6.0.0",
    "httpx[socks]>=0.25.0",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.21.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
extract = [
    "trafilatura>=1.6.0",  # Better content extraction from web pages
]
openai = [
    "openai>=1.0.0",  # OpenAI embedding API (alternative to sentence-transformers)
]
video = [
    "edge-tts>=6.1.0",  # Microsoft Edge TTS (free, no API key)
    "moviepy>=1.0.3",  # Video editing and composition
    "pillow>=10.0.0",  # Image generation for video frames
]

[project.scripts]
bb = "src.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
