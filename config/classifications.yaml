# Title keyword patterns for classification
# Each entry has: pattern (regex), category, and importance_boost
title_keywords:
  # AI keywords
  - pattern: '\b(GPT-?[45]|Claude|Gemini|LLM|ChatGPT)\b'
    case_insensitive: true
    category: "AI"
    boost: 2
  - pattern: '\b(machine learning|deep learning|neural network)\b'
    case_insensitive: true
    category: "AI"
    boost: 1
  - pattern: '\b(transformer|diffusion|RLHF)\b'
    case_insensitive: true
    category: "AI"
    boost: 1
  - pattern: '\b(AI|artificial intelligence|ML model)\b'
    case_insensitive: true
    category: "AI"
    boost: 1
  - pattern: '\b(RAG|fine-?tun|embeddings?|vector)\b'
    case_insensitive: true
    category: "AI"
    boost: 1

  # Programming keywords
  - pattern: '\b(Python|Rust|Go|JavaScript|TypeScript)\b'
    case_insensitive: false
    category: "编程"
    boost: 0
  - pattern: '\b(API|SDK|framework|library)\b'
    case_insensitive: true
    category: "编程"
    boost: 0
  - pattern: '\b(React|Vue|Angular|Node\.?js|Django|Flask)\b'
    case_insensitive: true
    category: "编程"
    boost: 0
  - pattern: '\b(database|SQL|PostgreSQL|MongoDB|Redis)\b'
    case_insensitive: true
    category: "编程"
    boost: 0
  - pattern: '\b(Docker|Kubernetes|K8s|DevOps|CI/CD)\b'
    case_insensitive: true
    category: "编程"
    boost: 1

  # Product launches
  - pattern: '\b(launch|announce|release|introducing)\b'
    case_insensitive: true
    category: "产品"
    boost: 1
  - pattern: '\b(new feature|update|v\d+\.\d+)\b'
    case_insensitive: true
    category: "产品"
    boost: 0

  # Funding/business
  - pattern: '\$\d+[MBK]|\d+ million|\d+ billion'
    case_insensitive: true
    category: "商业"
    boost: 1
  - pattern: '\b(Series [A-Z]|seed round|IPO|acquisition)\b'
    case_insensitive: true
    category: "创业"
    boost: 2
  - pattern: '\b(startup|founder|YC|Y Combinator)\b'
    case_insensitive: true
    category: "创业"
    boost: 1

  # Question posts (common on Reddit)
  - pattern: '^(How|What|Why|When|Where|Who|Which|Can|Should|Is|Are|Does|Do)\b'
    case_insensitive: true
    category: "其他"
    boost: 0
  - pattern: '\?$'
    case_insensitive: false
    category: "其他"
    boost: 0

  # Science
  - pattern: '\b(research|study|paper|published)\b'
    case_insensitive: true
    category: "科学"
    boost: 0
  - pattern: '\b(breakthrough|discovery|experiment)\b'
    case_insensitive: true
    category: "科学"
    boost: 1

# High-value keyword patterns for importance estimation (used for model tier selection)
high_value_patterns:
  - pattern: '(OpenAI|Anthropic|Google|Meta)\s+(announces?|launches?|releases?)'
    boost: 3
    confidence: 0.8
  - pattern: '\$\d+[BM]\b'
    boost: 2
    confidence: 0.75
  - pattern: '(breakthrough|major|significant)\s+(discovery|advancement|update)'
    boost: 2
    confidence: 0.7
  - pattern: '(Series [C-Z]|IPO|acqui)'
    boost: 2
    confidence: 0.7
  - pattern: '(GPT-?5|Claude\s+\d|Gemini\s+\d)'
    boost: 2
    confidence: 0.75

# Weak keyword patterns for importance estimation
weak_patterns:
  - pattern: '\b(GPT|Claude|Gemini|LLM|ChatGPT)\b'
    boost: 1
    confidence: 0.55
  - pattern: '\b(AI|ML|机器学习|深度学习)\b'
    boost: 1
    confidence: 0.5
  - pattern: '\b(launch|announce|release|发布|上线)\b'
    boost: 1
    confidence: 0.45
